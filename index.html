<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmbrapAI Rural — Assistente digital da propriedade</title>
<meta name="description" content="Plataforma de troca de valor: o produtor informa dados e recebe inteligência, mercado e crédito. A Embrapa recebe uma base viva para pesquisa e políticas públicas.">
<meta name="theme-color" content="#14532D">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EmbrapAI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde-mata:#14532D;
  --verde-medio:#2E7D46;
  --verde-broto:#5B9E3D;
  --terra:#7A4A21;
  --mel:#DFA820;
  --palha:#F5F7F0;
  --tinta:#1C2418;
  --cinza:#5E6B58;
  --linha:#DDE4D6;
  --branco:#FFFFFF;
  --erro:#B3261E;
  --raio:12px;
  --sombra:0 1px 2px rgba(28,36,24,.06),0 4px 14px rgba(28,36,24,.07);
  --fd:'Archivo',sans-serif;
  --fb:'Karla',sans-serif;
  --fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{font-family:var(--fb);background:var(--palha);color:var(--tinta);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
a{color:var(--verde-medio)}
button{font-family:var(--fb);cursor:pointer}
input,select,textarea{font-family:var(--fb);font-size:.95rem;padding:.55rem .7rem;border:1.5px solid var(--linha);border-radius:8px;background:var(--branco);color:var(--tinta);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mel);outline-offset:1px}
label{font-size:.82rem;font-weight:700;color:var(--cinza);display:block;margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.04em}
.mono{font-family:var(--fm)}

/* ---------- casca do app ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--verde-mata);color:#EAF3EA;padding:1.1rem .9rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-family:var(--fd);font-weight:900;font-size:1.15rem;letter-spacing:-.02em;color:#fff;display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem}
.logo .folha{width:26px;height:26px;background:var(--mel);border-radius:50% 0 50% 50%;display:inline-block;flex:none}
.logo small{display:block;font-family:var(--fb);font-weight:400;font-size:.66rem;letter-spacing:.12em;opacity:.75}
.nav{margin-top:1rem;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;background:none;border:0;color:#D8E6D6;padding:.5rem .6rem;border-radius:8px;font-size:.88rem;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.09)}
.nav button.ativo{background:var(--verde-broto);color:#0D2412;font-weight:700}
.nav .grupo{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin:.85rem .6rem .25rem}
.nav .ico{width:1.15rem;text-align:center;flex:none}

.main{padding:1.4rem 2rem 4rem;max-width:1060px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.topo .quem{font-size:.9rem;color:var(--cinza)}
.pontos{display:flex;align-items:center;gap:.7rem;background:var(--branco);border:1.5px solid var(--linha);border-radius:999px;padding:.35rem .9rem;box-shadow:var(--sombra)}
.pontos .num{font-family:var(--fm);font-weight:600;font-size:1.05rem;color:var(--verde-mata)}
.pontos .nivel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--terra);background:#F3E8D3;padding:.15rem .55rem;border-radius:999px}

/* ---------- componentes ---------- */
.cartao{background:var(--branco);border:1.5px solid var(--linha);border-radius:var(--raio);padding:1.15rem 1.25rem;box-shadow:var(--sombra);margin-bottom:1rem}
.cartao h2{margin-bottom:.35rem}
.cartao .sub{font-size:.88rem;color:var(--cinza);margin-bottom:.9rem}
.grade{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.campo{margin-bottom:.75rem}
.btn{background:var(--verde-medio);color:#fff;border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:700;font-size:.92rem}
.btn:hover{background:var(--verde-mata)}
.btn.fantasma{background:none;color:var(--verde-mata);border:1.5px solid var(--verde-medio)}
.btn.mel{background:var(--mel);color:#3A2B00}
.btn.mini{padding:.3rem .7rem;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:#E8F1E4;color:var(--verde-mata)}
.chip.terra{background:#F3E8D3;color:var(--terra)}
.chip.alerta{background:#FBE9E7;color:var(--erro)}
.kpi{background:var(--branco);border:1.5px solid var(--linha);border-radius:var(--raio);padding:.9rem 1rem}
.kpi .v{font-family:var(--fm);font-size:1.45rem;font-weight:600;color:var(--verde-mata)}
.kpi .l{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza);padding:.45rem .5rem;border-bottom:2px solid var(--linha)}
td{padding:.5rem;border-bottom:1px solid var(--linha)}
td.mono,th.num{font-family:var(--fm)}
.barra{height:9px;background:#E4EADF;border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde-broto);border-radius:99px;transition:width .5s ease}
.aviso{background:#FFF8E6;border:1.5px solid #EFD98F;border-radius:10px;padding:.7rem .9rem;font-size:.88rem}
.ok-lista li{list-style:none;padding:.4rem 0;border-bottom:1px dashed var(--linha);font-size:.92rem}
.ok-lista li::before{content:"✓";color:var(--verde-broto);font-weight:900;margin-right:.55rem}
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--verde-mata);color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:all .3s ease;z-index:99;pointer-events:none}
.toast.mostra{opacity:1;transform:none}
.toast .mais{color:var(--mel);font-family:var(--fm)}

/* ---------- assinatura: passaporte ---------- */
.passaporte{position:relative;background:linear-gradient(135deg,#17603A 0%,#14532D 60%,#0F3D22 100%);color:#EAF3EA;border-radius:16px;padding:1.4rem 1.5rem;overflow:hidden;margin-bottom:1.2rem}
.passaporte::after{content:"";position:absolute;inset:8px;border:1.5px dashed rgba(255,255,255,.28);border-radius:12px;pointer-events:none}
.passaporte h2{color:#fff;font-size:1.05rem;letter-spacing:.02em}
.passaporte .rotulo{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.passaporte .dado{font-family:var(--fm);font-size:.95rem}
.carimbo{position:absolute;right:1.4rem;top:50%;transform:translateY(-50%) rotate(-12deg);width:104px;height:104px;border:3px double var(--mel);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mel);text-align:center;font-family:var(--fd);font-weight:800;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.95}
.carimbo .pct{font-family:var(--fm);font-size:1.35rem;letter-spacing:0}
.pass-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem 1.4rem;margin-top:1rem;max-width:70%}
@media(max-width:760px){.pass-grid{max-width:100%;grid-template-columns:repeat(2,1fr)}.carimbo{position:static;transform:rotate(-8deg);margin:.8rem auto 0}}

/* ---------- tabs / chat / misc ---------- */
.tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{border:1.5px solid var(--linha);background:var(--branco);border-radius:999px;padding:.35rem .85rem;font-size:.85rem;font-weight:700;color:var(--cinza)}
.tabs button.ativo{background:var(--verde-mata);border-color:var(--verde-mata);color:#fff}
.chat{display:flex;flex-direction:column;gap:.6rem;max-height:420px;overflow-y:auto;padding:.4rem .2rem;margin-bottom:.8rem}
.msg{max-width:82%;padding:.6rem .85rem;border-radius:12px;font-size:.92rem;white-space:pre-line}
.msg.eu{align-self:flex-end;background:var(--verde-medio);color:#fff;border-bottom-right-radius:4px}
.msg.ia{align-self:flex-start;background:#EDF3EA;border:1.5px solid var(--linha);border-bottom-left-radius:4px}
.linha-chat{display:flex;gap:.5rem}
.sim-res{font-family:var(--fm);font-size:.92rem}
.svgbar{width:100%;height:auto}
.rodape-nota{font-size:.78rem;color:var(--cinza);margin-top:.6rem}
.hide{display:none!important}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:50;display:flex;align-items:center;gap:.3rem;padding:.4rem .5rem;overflow-x:auto}
  .sidebar .logo,.sidebar .grupo{display:none}
  .nav{flex-direction:row;margin-top:0}
  .nav button{white-space:nowrap;font-size:.78rem;padding:.45rem .6rem}
  .main{padding:1rem 1rem 6.5rem}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
}

/* ---------- modo aplicativo (PWA) ---------- */
@media(max-width:860px){
  .sidebar{padding-bottom:calc(.4rem + env(safe-area-inset-bottom))}
  .main{padding-bottom:calc(6.5rem + env(safe-area-inset-bottom))}
}
.instalar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4.2rem + env(safe-area-inset-bottom));z-index:60;background:var(--mel);color:#3A2B00;border:0;border-radius:999px;padding:.6rem 1.2rem;font-weight:800;font-size:.9rem;box-shadow:0 8px 20px rgba(0,0,0,.3)}
@media(min-width:861px){.instalar{bottom:1.2rem}}

@media print{
  .sidebar,.topo,.btn,.tabs{display:none!important}
  body{background:#fff}
  .cartao{box-shadow:none;border-color:#bbb}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="folha" aria-hidden="true"></span><span>EmbrapAI<br><small>PLATAFORMA RURAL</small></span></div>
    <nav class="nav" id="nav" aria-label="Módulos da plataforma"></nav>
  </aside>
  <main class="main">
    <div class="topo">
      <div>
        <h1 id="titulo-pagina">Início</h1>
        <div class="quem" id="quem"></div>
      </div>
      <div class="pontos" title="Seus pontos de participação">
        <span aria-hidden="true">🌱</span>
        <span class="num" id="pts">0</span> pts
        <span class="nivel" id="nivel">Semente</span>
      </div>
    </div>
    <div id="conteudo"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   EmbrapAI Rural — aplicativo completo em um arquivo.
   Funciona 100% no navegador (GitHub Pages). A API em /api é opcional.
   ===================================================================== */

/* ---------- armazenamento seguro (localStorage com reserva em memória) ---------- */
const Cofre = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){ ok = false; }
  return {
    ler(k, padrao){ try{ const v = ok ? localStorage.getItem(k) : mem[k]; return v ? JSON.parse(v) : padrao; }catch(e){ return padrao; } },
    gravar(k, v){ try{ const s = JSON.stringify(v); if(ok) localStorage.setItem(k,s); else mem[k]=s; }catch(e){} }
  };
})();

/* ---------- estado ---------- */
const PADRAO = {
  pontos: 0,
  historicoPontos: [],
  perfil: { nome:'', municipio:'', uf:'MA', areaTotal:'', modulosFiscais:'', caf:false, assistencia:false, irrigacao:false, energia:true, internet:false, areaDegradada:'' },
  culturas: [],        // {cultura, area, produtividade, mesPlantio}
  rebanho: { bovinos:'', aves:'', peixes:'', colmeias:'' },
  sistemas: { saf:false, ilp:false, ilpf:false, sisteminha:false, aquicultura:false, meliponicultura:false, apicultura:false, fruticultura:false, babacu:false, hortalicas:false },
  saf: { especies:'', idade:'', ha:'' },
  ilp: { haPasto:'', haLavoura:'', cabecas:'' },
  aqua: { especie:'tambaqui', biomassa:'', pesoMedio:'', mortalidade:'' },
  melipo: { colmeias:'', especie:'tiúba (Melipona fasciculata)' },
  sistem: { galinhas:'', peixes:'', hortaM2:'' },
  ofertas: [],         // {produto, ton, mes}
  vendas: [],          // {produto, ton, valor, data}
  anuncios: [],
  chat: []
};
let S = Object.assign({}, JSON.parse(JSON.stringify(PADRAO)), Cofre.ler('embrapai', {}));
function salvar(){ Cofre.gravar('embrapai', S); }

/* ---------- gamificação ---------- */
const NIVEIS = [ [0,'Semente'], [50,'Broto'], [150,'Lavoura'], [300,'Colheita'], [600,'Cooperador'] ];
const RECOMPENSAS = [
  [50,'1 análise de solo gratuita (parceiro local)'],
  [100,'Curso on-line Embrapa à sua escolha'],
  [150,'Kit de mudas nativas para SAF'],
  [250,'1 hora de consultoria técnica remota'],
  [400,'Desconto de 10% no marketplace de insumos'],
  [600,'Certificado de Boas Práticas + selo digital']
];
function pontuar(qtd, motivo){
  S.pontos += qtd;
  S.historicoPontos.unshift({qtd, motivo, quando: new Date().toLocaleDateString('pt-BR')});
  S.historicoPontos = S.historicoPontos.slice(0,40);
  salvar(); pintarPontos();
  toast(`+${qtd} pts — ${motivo}`);
}
function nivelAtual(){ let n=NIVEIS[0][1]; for(const [min,nome] of NIVEIS){ if(S.pontos>=min) n=nome; } return n; }
function pintarPontos(){ document.getElementById('pts').textContent=S.pontos; document.getElementById('nivel').textContent=nivelAtual(); }
let toastTimer=null;
function toast(txt){
  const t=document.getElementById('toast');
  t.innerHTML = txt.startsWith('+') ? `<span class="mais">${txt.split('—')[0]}</span>— ${txt.split('—')[1]||''}` : txt;
  t.classList.add('mostra');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('mostra'), 2600);
}

/* ---------- dados de referência (valores médios; ajustáveis) ---------- */
const CULTURAS = {
  'mandioca':      {prod:15,  unid:'t/ha', preco:800,  plantio:[12,1,2], colheita:[8,9,10], insumo:'manivas-semente (RENIVA), calcário 1 t/ha'},
  'milho':         {prod:4,   unid:'t/ha', preco:1100, plantio:[12,1],   colheita:[5,6],    insumo:'sementes 20 kg/ha, NPK 300 kg/ha'},
  'arroz':         {prod:3.5, unid:'t/ha', preco:1500, plantio:[12,1],   colheita:[5,6],    insumo:'sementes 80 kg/ha'},
  'feijão-caupi':  {prod:1,   unid:'t/ha', preco:4500, plantio:[1,2],    colheita:[4,5],    insumo:'sementes 25 kg/ha, inoculante'},
  'tomate':        {prod:45,  unid:'t/ha', preco:2500, plantio:[5,6],    colheita:[8,9],    insumo:'mudas, tutoramento, fertirrigação'},
  'banana':        {prod:18,  unid:'t/ha', preco:1800, plantio:[12,1],   colheita:[1,12],   insumo:'mudas 1.600/ha, adubação orgânica'},
  'abacaxi':       {prod:35,  unid:'t/ha', preco:1400, plantio:[1,2],    colheita:[11,12],  insumo:'mudas 40 mil/ha'},
  'cacau':         {prod:0.8, unid:'t/ha', preco:22000,plantio:[1,2],    colheita:[10,11],  insumo:'mudas clonais, sombreamento'},
  'açaí':          {prod:6,   unid:'t/ha', preco:3500, plantio:[1,2],    colheita:[8,11],   insumo:'mudas 400/ha, irrigação'},
  'hortaliças':    {prod:20,  unid:'t/ha', preco:3000, plantio:[1,12],   colheita:[1,12],   insumo:'sementes, composto orgânico'},
  'babaçu (amêndoa)':{prod:0.25,unid:'t/ha',preco:5000,plantio:[0],      colheita:[8,12],   insumo:'extrativismo manejado'},
  'mel (kg/colmeia)':{prod:0,  unid:'kg',   preco:60,   plantio:[0],      colheita:[9,12],   insumo:'—'}
};
const MESES = ['—','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* demandas de mercado simuladas (na versão com API, vêm do banco) */
const DEMANDAS = [
  {comprador:'Supermercado Mateus (São Luís)', produto:'mandioca', ton:8,  mes:9,  preco:900,  tipo:'Varejo'},
  {comprador:'Prefeitura — PNAE (Itapecuru)',  produto:'hortaliças', ton:2, mes:8, preco:3200, tipo:'PNAE'},
  {comprador:'CONAB — PAA (MA)',               produto:'feijão-caupi', ton:5, mes:5, preco:4800,tipo:'PAA'},
  {comprador:'Cooperativa COOPFRUTA',          produto:'banana', ton:12, mes:10, preco:1900, tipo:'Cooperativa'},
  {comprador:'Agroindústria de fécula (Bacabal)', produto:'mandioca', ton:40, mes:10, preco:820, tipo:'Agroindústria'},
  {comprador:'Rede de restaurantes (São Luís)',   produto:'tomate', ton:40, mes:9,  preco:2700, tipo:'Foodservice'},
  {comprador:'CEASA-MA',                        produto:'abacaxi', ton:15, mes:12, preco:1500, tipo:'CEASA'},
  {comprador:'Exportadora de mel (Barreirinhas)', produto:'mel (kg/colmeia)', ton:1.5, mes:11, preco:75, tipo:'Exportação'}
];

/* tecnologias Embrapa — motor de recomendação por regras */
const TECNOLOGIAS = [
  {nome:'RENIVA — Rede de manivas-semente', regra:s=>s.culturas.some(c=>c.cultura==='mandioca'),
   por:'Você cultiva mandioca. Manivas de qualidade elevam a produtividade em 30–60%.',
   invest:'R$ 400–800/ha', retorno:'+4 a +8 t/ha', ambiente:'Menos área para a mesma produção', credito:'Pronaf Custeio'},
  {nome:'Sisteminha Embrapa', regra:s=>num(s.perfil.areaTotal)>0 && num(s.perfil.areaTotal)<=10 && !s.sistemas.sisteminha,
   por:'Propriedade de pequeno porte: produção integrada de proteína e hortaliças em ~100 m².',
   invest:'R$ 3–8 mil', retorno:'Alimentação da família + excedente de R$ 400–900/mês', ambiente:'Reuso de água e nutrientes', credito:'Pronaf B / Fomento Rural'},
  {nome:'ILPF — Integração Lavoura-Pecuária-Floresta', regra:s=>num(s.ilp.haPasto)>=5||num(s.rebanho.bovinos)>=10,
   por:'Você tem pastagem e rebanho. ILPF intensifica a produção e estoca carbono.',
   invest:'R$ 4–7 mil/ha', retorno:'+40–70% de receita/ha em 5 anos', ambiente:'5–10 t CO₂e/ha/ano estocadas', credito:'RenovAgro (ABC+)'},
  {nome:'SAF — Sistema Agroflorestal', regra:s=>!s.sistemas.saf && (s.sistemas.fruticultura||s.sistemas.babacu||num(s.perfil.areaDegradada)>0),
   por:'Diversifica renda (frutas, madeira, amêndoas) e recupera áreas degradadas.',
   invest:'R$ 8–15 mil/ha (implantação)', retorno:'R$ 6–20 mil/ha/ano após 4–6 anos', ambiente:'Biodiversidade + carbono', credito:'Pronaf Floresta / ABC+'},
  {nome:'AFERE — Restauração florestal', regra:s=>num(s.perfil.areaDegradada)>0,
   por:`Você declarou área degradada. AFERE orienta a recuperação de baixo custo.`,
   invest:'R$ 2–6 mil/ha', retorno:'Regularização ambiental (CAR) + PSA futuros', ambiente:'Recuperação de solo e água', credito:'Pronaf Floresta'},
  {nome:'Meliponicultura (tiúba/uruçu)', regra:s=>!s.sistemas.meliponicultura && (s.sistemas.saf||s.sistemas.fruticultura),
   por:'Suas frutíferas ganham polinização; o mel de melipona vale 3–5× o mel comum.',
   invest:'R$ 250–400/colmeia', retorno:'R$ 300–600/colmeia/ano', ambiente:'Polinizadores nativos', credito:'Pronaf B'},
  {nome:'Aquicultura (tambaqui/tilápia)', regra:s=>!s.sistemas.aquicultura && (s.perfil.irrigacao||num(s.rebanho.peixes)>0),
   por:'Você dispõe de água. Piscicultura aproveita o recurso e diversifica a renda.',
   invest:'R$ 15–40 mil (viveiro 1.000 m²)', retorno:'R$ 12–25 mil/ciclo', ambiente:'Água de despesca fertiliza a horta', credito:'Pronaf Mais Alimentos'},
  {nome:'BRS Capiaçu (capim para silagem)', regra:s=>num(s.rebanho.bovinos)>=5,
   por:'Volumoso de alta produção para segurar o rebanho na seca.',
   invest:'R$ 3–5 mil/ha', retorno:'180–250 t/ha/ano de massa verde', ambiente:'Menos pressão sobre pasto nativo', credito:'Pronaf Custeio'}
];

/* políticas públicas — regras de elegibilidade simplificadas */
const POLITICAS = [
  {nome:'Pronaf B (microcrédito até R$ 10 mil)', regra:s=>s.perfil.caf && num(s.perfil.areaTotal)<=20},
  {nome:'Pronaf Mais Alimentos (investimento)', regra:s=>s.perfil.caf},
  {nome:'RenovAgro / ABC+ (agricultura de baixo carbono)', regra:s=>s.sistemas.ilpf||s.sistemas.ilp||s.sistemas.saf},
  {nome:'PAA — Programa de Aquisição de Alimentos', regra:s=>s.perfil.caf && s.culturas.length>0},
  {nome:'PNAE — Alimentação Escolar (30% da merenda)', regra:s=>s.perfil.caf && (s.sistemas.hortalicas||s.culturas.length>0)},
  {nome:'Garantia-Safra (semiárido)', regra:s=>s.perfil.caf && num(s.perfil.areaTotal)<=5},
  {nome:'Crédito de carbono (mercado voluntário)', regra:s=>s.sistemas.saf||s.sistemas.ilpf},
  {nome:'Editais FAPEMA / ATeG SENAR', regra:s=>true}
];

/* ---------- utilidades ---------- */
const R$ = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const num = v => { const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };
const el = id => document.getElementById(id);
function v(id){ return el(id) ? el(id).value : ''; }
function esc(t){ return String(t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

/* completude do passaporte (0–100) */
function completude(){
  let p=0;
  if(S.perfil.nome) p+=10; if(S.perfil.municipio) p+=10; if(num(S.perfil.areaTotal)>0) p+=15;
  if(S.culturas.length) p+=20; if(Object.values(S.sistemas).some(Boolean)) p+=15;
  if(num(S.rebanho.bovinos)+num(S.rebanho.aves)+num(S.rebanho.peixes)+num(S.rebanho.colmeias)>0) p+=10;
  if(S.perfil.caf) p+=10; if(S.ofertas.length) p+=10;
  return Math.min(100,p);
}
/* produção prevista por cultura */
function previsoes(){
  return S.culturas.map(c=>{
    const ref=CULTURAS[c.cultura]||{prod:0,preco:0,colheita:[0]};
    const prod = num(c.produtividade)>0 ? num(c.produtividade) : ref.prod;
    const ton = +(num(c.area)*prod).toFixed(1);
    return {...c, ton, receita: ton*ref.preco, mesColheita: ref.colheita[0], preco: ref.preco, insumo: ref.insumo};
  });
}
function carbono(){ // estimativa simples de estoque anual
  let t=0;
  t += num(S.saf.ha)*8;                    // SAF ~8 t CO2e/ha/ano
  if(S.sistemas.ilpf) t += num(S.ilp.haPasto)*5;
  else if(S.sistemas.ilp) t += num(S.ilp.haPasto)*1.5;
  return +t.toFixed(1);
}
</script>


<script>

}

/* ---------- páginas ---------- */
const PAGINAS = {};

      <div><div class="rotulo">Área total</div><div class="dado">${S.perfil.areaTotal||'—'} ha</div></div>

      <div><div class="rotulo">Sistemas</div><div class="dado">${Object.entries(S.sistemas).filter(([k,x])=>x).map(([k])=>k.toUpperCase()).join(', ')||'—'}</div></div>

    </div>
    <div class="carimbo"><span class="pct">${c}%</span>completo<br>verificado</div>
  </div>
  <div class="grade g4">
    <div class="kpi"><div class="v">${R$(receita)}</div><div class="l">Receita bruta prevista</div></div>
    <div class="kpi"><div class="v">${aptas}</div><div class="l">Políticas em que você está apto</div></div>
    <div class="kpi"><div class="v">${recs}</div><div class="l">Tecnologias recomendadas</div></div>
    <div class="kpi"><div class="v">${S.pontos}</div><div class="l">Pontos acumulados</div></div>
  </div>
  <div class="cartao">
    <h2>Como funciona a troca de valor</h2>
    <p class="sub">Cada dado que você informa gera um serviço de volta. Quanto mais completo o passaporte, melhores as previsões, os compradores e o crédito.</p>

      <li>Você informa área e culturas → recebe <b>previsão de produção, insumos e calendário</b>.</li>
      <li>Você informa quanto e quando vai colher → a plataforma <b>encontra compradores</b> (PNAE, PAA, cooperativas, CEASA) e monta <b>lotes coletivos</b> com vizinhos.</li>
      <li>Você mantém os dados em dia → ganha <b>pontos</b> trocáveis por análises de solo, cursos, mudas e consultorias.</li>

    </ul>
    <p style="margin-top:.9rem"><button class="btn" onclick="ir('passaporte')">Completar meu passaporte</button>
    <button class="btn fantasma" onclick="ir('mercado')">Ver compradores</button></p>
  </div>`;
  quem();
};

PAGINAS.passaporte = () => {
  const chk=(k)=>S.sistemas[k]?'checked':'';
  el('conteudo').innerHTML = `
  <div class="cartao">

      <div class="campo"><label><input type="checkbox" id="f-ast" ${S.perfil.assistencia?'checked':''} style="width:auto"> Recebe assistência técnica</label>

      ${['saf|SAF','ilp|ILP','ilpf|ILPF','sisteminha|Sisteminha','aquicultura|Aquicultura','meliponicultura|Meliponicultura','apicultura|Apicultura','fruticultura|Fruticultura','babacu|Babaçu','hortalicas|Hortaliças'].map(x=>{const [k,n]=x.split('|');return `<label style="text-transform:none;font-size:.9rem"><input type="checkbox" data-sis="${k}" ${chk(k)} style="width:auto"> ${n}</label>`;}).join('')}

    <button class="btn" style="margin-top:.6rem" onclick="salvarSistemas()">Salvar sistemas</button>
  </div>

  <div class="cartao">
    <h2>3 · Culturas e histórico</h2>
    <p class="sub">Se você não souber a produtividade, deixe em branco: usamos a média regional.</p>
    <div class="grade g4">
      <div class="campo"><label for="c-cult">Cultura</label><select id="c-cult">${Object.keys(CULTURAS).map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="campo"><label for="c-area">Área (ha)</label><input id="c-area" type="number" min="0" step="0.1"></div>
      <div class="campo"><label for="c-prod">Produtividade (t/ha)</label><input id="c-prod" type="number" min="0" step="0.1" placeholder="média regional"></div>

    <tbody>${previsoes().map((c,i)=>`<tr><td>${esc(c.cultura)}</td><td class="mono">${c.area} ha</td><td class="mono">${num(c.produtividade)||CULTURAS[c.cultura].prod} t/ha</td><td class="mono">${c.ton} t</td><td><button class="btn mini fantasma" onclick="delCultura(${i})">remover</button></td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--cinza)">Nenhuma cultura cadastrada ainda.</td></tr>'}</tbody></table>

      <div class="campo"><label for="r-bov">Bovinos (cab.)</label><input id="r-bov" type="number" min="0" value="${esc(S.rebanho.bovinos)}"></div>

function salvarPerfil(){

}
function salvarSistemas(){
  document.querySelectorAll('[data-sis]').forEach(c=>S.sistemas[c.dataset.sis]=c.checked);
  salvar(); pontuar(12,'Sistemas produtivos atualizados');
}
function addCultura(){
  if(num(v('c-area'))<=0){ toast('Informe a área da cultura.'); return; }

  salvar(); pontuar(10,'Cultura cadastrada'); PAGINAS.passaporte();
}
function delCultura(i){ S.culturas.splice(i,1); salvar(); PAGINAS.passaporte(); }
function salvarRebanho(){

PAGINAS.planejamento = () => {

    <h2>Transformar previsão em oferta de venda</h2>
    <p class="sub">Publique sua colheita futura no Mercado Garantido com um clique. +8 pts por oferta.</p>
    ${prev.map((c,i)=>`<button class="btn fantasma mini" style="margin:.2rem" onclick="ofertar(${i})">Ofertar ${c.ton} t de ${esc(c.cultura)} (${MESES[c.mesColheita]||'—'})</button>`).join('')}
  </div>`;
};
function ofertar(i){
  const c=previsoes()[i];
  S.ofertas.push({produto:c.cultura, ton:c.ton, mes:c.mesColheita||9});

}

<script>
/* =====================================================================
   BLOCO 3 — Mercado garantido, venda coletiva, marketplace, políticas,
   tecnologias, sistemas produtivos
   ===================================================================== */
PAGINAS.mercado = () => {
  const matches = S.ofertas.map(o=>{
    const d = DEMANDAS.filter(x=>x.produto===o.produto && Math.abs(((x.mes-o.mes)+12)%12)<=2);
    return {oferta:o, demandas:d};
  });
  el('conteudo').innerHTML = `
  <div class="cartao">
    <h2>Suas ofertas</h2>
    <p class="sub">A plataforma cruza automaticamente o que você vai colher com quem quer comprar.</p>
    ${S.ofertas.length? `<table><thead><tr><th>Produto</th><th class="num">Quantidade</th><th>Disponível em</th><th>Compradores compatíveis</th><th></th></tr></thead><tbody>
      ${matches.map((m,i)=>`<tr><td><b>${esc(m.oferta.produto)}</b></td><td class="mono">${m.oferta.ton} t</td><td>${MESES[m.oferta.mes]}</td><td>${m.demandas.length? `<span class="chip">🔔 ${m.demandas.length} interessado(s)</span>`:'<span style="color:var(--cinza)">aguardando</span>'}</td><td><button class="btn mini fantasma" onclick="S.ofertas.splice(${i},1);salvar();PAGINAS.mercado()">retirar</button></td></tr>`).join('')}
    </tbody></table>` : '<p class="sub">Nenhuma oferta ainda. Publique a partir do <a href="#" onclick="ir(\'planejamento\');return false">Planejamento</a>.</p>'}
  </div>
  ${matches.filter(m=>m.demandas.length).map(m=>m.demandas.map(d=>{
    const cobre = m.oferta.ton>=d.ton;
    const faltam = Math.max(0, d.ton-m.oferta.ton);
    const nProd = Math.ceil(faltam/Math.max(1,m.oferta.ton));
    return `<div class="cartao" style="border-left:5px solid var(--mel)">
      <h3>🔔 ${esc(d.comprador)} quer ${d.ton} t de ${esc(d.produto)} em ${MESES[d.mes]} <span class="chip terra">${d.tipo}</span></h3>
      <p class="sub">Preço de referência: <b class="mono">${R$(d.preco)}/t</b> · valor potencial para você: <b class="mono">${R$(Math.min(m.oferta.ton,d.ton)*d.preco)}</b></p>
      ${cobre
        ? `<p>✅ Sua produção <b>cobre sozinha</b> esta demanda.</p>`
        : `<p>Sua oferta cobre <b>${m.oferta.ton} t</b>. Faltam <b>${faltam.toFixed(1)} t</b> — a plataforma encontrou <b>${nProd+3} produtores</b> da sua região com produção semelhante e pode montar um <b>lote coletivo</b> automaticamente.</p>
           <div class="barra" style="margin:.5rem 0"><i style="width:${Math.min(100,m.oferta.ton/d.ton*100)}%"></i></div>`}
      <button class="btn mel" onclick="fecharVenda('${esc(d.produto)}',${Math.min(m.oferta.ton,d.ton)},${d.preco})">Manifestar interesse ${cobre?'':'no lote coletivo'}</button>
    </div>`;}).join('')).join('')}
  <div class="cartao">
    <h2>Demandas abertas na sua região</h2>
    <table><thead><tr><th>Comprador</th><th>Produto</th><th class="num">Qtd.</th><th>Quando</th><th class="num">Preço</th><th>Canal</th></tr></thead>
    <tbody>${DEMANDAS.map(d=>`<tr><td>${esc(d.comprador)}</td><td>${esc(d.produto)}</td><td class="mono">${d.ton} t</td><td>${MESES[d.mes]}</td><td class="mono">${R$(d.preco)}/t</td><td><span class="chip">${d.tipo}</span></td></tr>`).join('')}</tbody></table>
    <p class="rodape-nota">Nesta versão de demonstração as demandas são simuladas. Com a API ligada, elas vêm de cadastros reais de compradores (supermercados, prefeituras/PNAE, CONAB/PAA, cooperativas, CEASAs e agroindústrias).</p>
  </div>`;
};
function fecharVenda(produto, ton, preco){
  S.vendas.unshift({produto, ton, valor:ton*preco, data:new Date().toLocaleDateString('pt-BR')});
  salvar(); pontuar(8,'Venda registrada');
  toast('Interesse enviado! O comprador receberá seus dados de contato.');
}

PAGINAS.marketplace = () => {
  el('conteudo').innerHTML = `

<script>

PAGINAS.simulador = () => {
  el('conteudo').innerHTML = `
  <div class="cartao">
    <h2>Gêmeo digital da propriedade</h2>
    <p class="sub">Simule mudanças antes de investir. Os cenários usam os dados reais do seu passaporte.</p>
    <div class="grade g3">
      <div class="campo"><label for="sim-saf">+ SAF (ha)</label><input id="sim-saf" type="range" min="0" max="10" step="0.5" value="0" oninput="simular()"></div>

      <div class="campo"><label style="text-transform:none;font-size:.9rem"><input id="sim-sist" type="checkbox" onchange="simular()" style="width:auto"> Implantar Sisteminha</label></div>
    </div>
    <div id="sim-out"></div>
  </div>`;
  simular();

function simular(){
  const safHa=num(v('sim-saf')), ilpfHa=num(v('sim-ilpf')), sist=el('sim-sist')?.checked;
  const rendaBase = previsoes().reduce((a,b)=>a+b.receita,0);
  const dRenda = safHa*12000*0.6 + ilpfHa*2600 + (sist?7200:0);
  const dCarbono = safHa*8 + ilpfHa*3.5;
  const invest = safHa*11000 + ilpfHa*5500 + (sist?6000:0);
  const larg = x => Math.min(100, x/Math.max(1,(rendaBase+dRenda))*100);
  el('sim-out').innerHTML = `
  <div class="grade g4" style="margin:1rem 0">
    <div class="kpi"><div class="v">+${R$(dRenda)}</div><div class="l">Renda adicional/ano</div></div>
    <div class="kpi"><div class="v">+${dCarbono.toFixed(1)} t</div><div class="l">CO₂e/ano</div></div>
    <div class="kpi"><div class="v">${R$(invest)}</div><div class="l">Investimento estimado</div></div>
    <div class="kpi"><div class="v">${invest>0?(invest/Math.max(1,dRenda)).toFixed(1):'0'} anos</div><div class="l">Retorno do investimento</div></div>
  </div>

    <div style="margin:.3rem 0">Renda atual&nbsp; <span class="mono">${R$(rendaBase)}</span><div class="barra"><i style="width:${larg(rendaBase)}%;background:var(--cinza)"></i></div></div>
    <div style="margin:.3rem 0">Renda no cenário&nbsp; <span class="mono">${R$(rendaBase+dRenda)}</span><div class="barra"><i style="width:${larg(rendaBase+dRenda)}%"></i></div></div>
  </div>
  <p class="rodape-nota">"E se eu aumentar 2 ha de SAF?" · "E se converter pastagem em ILPF?" · "E se colocar um Sisteminha?" — arraste os controles e veja o efeito na renda e no carbono.</p>`;
}

PAGINAS.assistente = () => {
  el('conteudo').innerHTML = `
  <div class="cartao">
    <h2>IA da propriedade</h2>
    <p class="sub">Responde com base nos <b>seus</b> dados. Experimente: "quanto vou colher?", "quanto vou gastar?", "qual tecnologia devo usar?", "quanto carbono sequestro?", "quanto posso ganhar?".</p>
    <div class="chat" id="chat">${S.chat.map(m=>`<div class="msg ${m.eu?'eu':'ia'}">${esc(m.txt)}</div>`).join('')||'<div class="msg ia">Olá! Sou a IA da sua propriedade. Pergunte algo sobre a sua produção. 🌱</div>'}</div>
    <div class="linha-chat">
      <input id="chat-in" placeholder="Escreva sua pergunta…" onkeydown="if(event.key==='Enter')perguntar()">
      <button class="btn" onclick="perguntar()">Enviar</button>
    </div>
    <p class="rodape-nota">Nesta versão estática as respostas são calculadas no navegador. Ligando a API (pasta <span class="mono">api/</span>), as perguntas passam a ser respondidas por um modelo de linguagem com acesso ao seu passaporte.</p>
  </div>`;
  const ch=el('chat'); ch.scrollTop=ch.scrollHeight;
};
function responder(q){
  q=q.toLowerCase();
  const prev=previsoes(); const receita=prev.reduce((a,b)=>a+b.receita,0);
  if(!S.perfil.nome && !prev.length) return 'Ainda não conheço sua propriedade. Preencha o Passaporte Digital e volte aqui — aí minhas respostas ficam personalizadas.';
  if(q.includes('colher')||q.includes('produção')||q.includes('produzir'))
    return prev.length? 'Previsão de colheita:\n'+prev.map(c=>`• ${c.cultura}: ${c.ton} t (${MESES[c.mesColheita]||'contínuo'})`).join('\n') : 'Cadastre suas culturas no passaporte para eu calcular a colheita.';
  if(q.includes('gastar')||q.includes('custo'))
    return `Com base nas culturas cadastradas, estimo custos de produção em torno de ${R$(receita*0.45)}/ano (≈45% da receita bruta prevista de ${R$(receita)}). O detalhamento por insumo está no módulo Planejamento.`;
  if(q.includes('ganhar')||q.includes('renda')||q.includes('receita'))
    return `Receita bruta prevista: ${R$(receita)}/ano. Margem estimada: ${R$(receita*0.55)}. No Gêmeo Digital você simula quanto a renda sobe com SAF, ILPF ou Sisteminha.`;
  if(q.includes('carbono'))
    return `Sua propriedade estoca cerca de ${carbono()} t CO₂e/ano com os sistemas atuais. ${carbono()>0?'Isso pode virar receita no mercado voluntário de carbono (veja Crédito e políticas).':'Implantar SAF ou ILPF criaria estoque de carbono e possível receita extra.'}`;
  if(q.includes('tecnolog')||q.includes('embrapa'))
    { const r=TECNOLOGIAS.filter(t=>t.regra(S)).slice(0,3); return r.length? 'Tecnologias Embrapa recomendadas para você:\n'+r.map(t=>`• ${t.nome} — ${t.retorno}`).join('\n') : 'Complete o passaporte para eu recomendar tecnologias.'; }
  if(q.includes('crédito')||q.includes('pronaf')||q.includes('financi'))
    { const a=POLITICAS.filter(p=>p.regra(S)); return 'Você está apto a:\n'+a.map(p=>'✓ '+p.nome).join('\n'); }
  if(q.includes('vender')||q.includes('comprador')||q.includes('mercado'))
    return 'Há '+DEMANDAS.length+' demandas abertas na sua região agora. Publique sua colheita futura no Planejamento e eu cruzo com os compradores automaticamente.';
  if(q.includes('clima')||q.includes('chuva')||q.includes('plantar'))
    return 'No Maranhão a janela principal de plantio vai de dezembro a fevereiro (chuvas dez–mai). Veja alertas no módulo Clima.';
  return 'Posso responder sobre: colheita prevista, custos, renda, carbono, tecnologias Embrapa, crédito e compradores. Reformule a pergunta com uma dessas palavras. 😉';
}
function perguntar(){
  const q=v('chat-in'); if(!q) return;
  S.chat.push({eu:true,txt:q}); S.chat.push({eu:false,txt:responder(q)});
  S.chat=S.chat.slice(-30); salvar(); el('chat-in').value='';
  PAGINAS.assistente();
}

/* convite de instalação (Android/Chrome) */
let promptInstalar=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); promptInstalar=e;
  if(document.querySelector('.instalar')) return;
  const b=document.createElement('button');
  b.className='instalar'; b.textContent='📲 Instalar o aplicativo';
  b.onclick=async()=>{ b.remove(); promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar=null; };
  document.body.appendChild(b);
});
window.addEventListener('appinstalled',()=>{ toast('Aplicativo instalado! 🌱'); document.querySelector('.instalar')?.remove(); });
